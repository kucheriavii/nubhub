services:
  nubhub:
    build:
      context: .
      dockerfile: Dockerfile
    image: nubhub:latest
    container_name: nubhub-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DB_PATH=/app/data/db.json
    volumes:
      - nubhub-data:/app/data

volumes:
  nubhub-data:
    driver: local
